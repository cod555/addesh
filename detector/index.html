<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2421">
<title>Addesh Detect · قدّيش</title>
<link rel="icon" href="icons/favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage" data-state="loading">
  <video id="video" playsinline muted autoplay></video>
  <img id="still" alt="" hidden>
  <canvas id="overlay" aria-hidden="true"></canvas>

  <header class="top">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="36" height="36"><span>Addesh <b>Detect</b></span></div>
    <button id="lang" type="button" class="chip" aria-label="Change language">EN</button>
  </header>

  <section class="result" aria-live="off">
    <p id="value" class="value">…</p>
    <p id="sub" class="sub"></p>
  </section>

  <footer class="bottom">
    <div class="row">
      <button id="live" type="button" class="chip on">Camera</button>
      <label class="chip" for="file">Photo</label>
      <input id="file" type="file" accept="image/*" hidden>
      <span id="stats" class="stats" dir="ltr"></span>
    </div>
    <div id="samples" class="samples" dir="ltr" aria-label="Sample photos"></div>
  </footer>
  <p id="announcer" class="sr" aria-live="assertive"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script src="app.js"></script>
</body>
</html>
